image: oven/bun:alpine
 
stages:
    - build
    - deploy

cache:
  paths:
    - ./orm/node_modules/
    - ./orm/bun.lockb

build:
  stage: build
  only:
    - main
  before_script:
    #Website
    - cd ./orm
    - rm -rf dist    
    - bun install --no-progress
    - cd ..
    #Compress
    - apk add --no-cache brotli zstd gzip
  script:
    #Website
    - cd ./orm
    - bun run build
    - cd ..
    - mkdir -p build
    - cp -r ./orm/dist/. build 
    #Compression
    - |
      find build -type f \
        -regex '.*\.\(htm\|html\|txt\|text\|js\|xml\|json\|mjs\|svg\|yaml\|yml\|toml\|css\|pdf\)$' \
        -exec gzip -f -k -9 {} + \
        -exec brotli -f -k -Z {} + \
        -exec zstd -f -k --ultra -22 -q {} +
  artifacts:
        paths:
          - build

pages:
  stage: deploy
  only:
    - main
  dependencies:
    - build
  script:
    - rm -rf public
    - mkdir -p public
    - cp -r build/. public
    - ls ./public -R -a
  artifacts:
    paths:
      - public

